apiVersion: v1
kind: Endpoints
metadata:
  name: influxdb-extern
subsets:
  - addresses:
      - ip: 192.168.2.122  # <--- HIER DIE IP DER MASCHINE EINTRAGEN
    ports:
      - port: 8086        # Standardport für InfluxDB v2
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb-extern
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8086
      targetPort: 8086