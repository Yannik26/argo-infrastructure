apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: influx-adp.yannikmueller.eu-cert
spec:
  secretName: influx-adp.yannikmueller.eu-secret
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - influx-adp.yannikmueller.eu
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: influxdb-route
  namespace: default
spec:
  entryPoints:
    - websecure      # Wir nutzen Port 443 (HTTPS)
  routes:
  - match: Host(`influx-adp.yannikmueller.eu`) # <--- DEINE DOMAIN
    kind: Rule
    services:
    - name: influxdb-extern
      port: 80
  tls:
    secretName: "influx-adp.yannikmueller.eu-secret"